name: Build ANGLE

on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - linux-x64
      publish:
        description: Publish a release (requires all platforms)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'windows-x64' && 'windows-2025' || matrix.platform == 'linux-x64' && 'ubuntu-22.04' || 'macos-15' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
              && '["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]'
              || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage and build
        run: bash platforms/build.sh "${{ matrix.platform }}"

      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: ignore

      - name: Package
        run: |
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            cd dist/${{ matrix.platform }} && 7z a -r ../../angle-${{ matrix.platform }}.zip .
          else
            tar czf angle-${{ matrix.platform }}.tar.gz -C dist/${{ matrix.platform }} .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: angle-${{ matrix.platform }}
          path: angle-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./platforms/config.sh
          TAG="electron-v${ELECTRON_VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "ANGLE for Electron ${ELECTRON_VERSION}: Chromium ${CHROMIUM_VERSION}, ANGLE ${ANGLE_SHA}, with Electron ANGLE patches" \
            angle-*.zip angle-*.tar.gz
